<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>কারু ছায়া — অ্যাডমিন</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,"Noto Sans Bengali",sans-serif;background:#fbf6ee;margin:0;padding:16px;color:#28231e;line-height:1.5}
h1{color:#173b27;font-size:22px;margin:4px 0 14px}
h2{color:#173b27;font-size:18px;margin:0 0 10px}
.box{background:#fff;border:1px solid #eee5d9;padding:14px;margin-bottom:14px;border-radius:6px}
label{display:block;font-size:14px;font-weight:bold;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid #d9d0c4;font-size:15px;font-family:inherit;border-radius:4px}
button{padding:11px 16px;border:0;background:#173b27;color:#fff;font-weight:bold;cursor:pointer;margin-top:10px;border-radius:4px;font-size:14px;margin-right:6px}
button:disabled{opacity:.6;cursor:wait}
button.sec{background:#eee3d3;color:#173b27}
button.del{background:#7b2034}
.item{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}
.item img{width:60px;height:70px;object-fit:cover;background:#eee3d3;border-radius:3px}
.item .info{flex:1;font-size:14px;min-width:0}
.item .info small{color:#766d63}
.item .acts{display:flex;flex-direction:column}
.item .acts button{margin:3px 0;padding:7px 10px;font-size:12px}
#preview img{width:120px;height:150px;object-fit:cover;margin-top:8px;border-radius:4px;background:#eee3d3}
.msg{padding:8px;margin-top:8px;font-size:14px}
.err{color:#7b2034}.ok{color:#173b27}
.hidden{display:none}
</style>
</head>
<body>
<h1>কারু ছায়া — অ্যাডমিন</h1>

<div id="loginBox" class="box">
  <label for="email">ইমেইল</label>
  <input id="email" type="email" autocomplete="username">
  <label for="password">পাসওয়ার্ড</label>
  <input id="password" type="password" autocomplete="current-password">
  <button id="loginBtn" onclick="login()">লগইন</button>
  <div id="loginMsg" class="msg err"></div>
</div>

<div id="adminBox" class="hidden">
  <div class="box">
    <button class="sec" onclick="logout()">লগআউট</button>
    <h2 id="formTitle">নতুন ডিজাইন যোগ করুন</h2>
    <input type="hidden" id="editId">

    <label for="name">ডিজাইনের নাম</label>
    <input id="name" placeholder="যেমন: শাড়ি ডিজাইন ০৫">

    <label for="category">বিভাগ</label>
    <select id="category">
      <option value="Saree">শাড়ি</option>
      <option value="Salwar">সেলোয়ার-কামিজ</option>
      <option value="Kurti">কুর্তি</option>
      <option value="Lehenga">লেহেঙ্গা</option>
      <option value="Panjabi">পাঞ্জাবি</option>
    </select>

    <label for="price">দাম (টাকা) — খালি রাখলে "দাম জানতে মেসেজ করুন" দেখাবে</label>
    <input id="price" type="number" min="0">

    <label for="description">বিবরণ</label>
    <textarea id="description" rows="2"></textarea>

    <label for="sort">ক্রম (ছোট সংখ্যা আগে আসবে)</label>
    <input id="sort" type="number" value="0">

    <label for="image">ছবি (এডিট করার সময় না দিলে আগের ছবিই থাকবে)</label>
    <input id="image" type="file" accept="image/*" onchange="previewFile()">
    <div id="preview"></div>

    <button id="saveBtn" onclick="saveProduct()">সেভ করুন</button>
    <button class="sec" onclick="resetForm()">নতুন ফর্ম</button>
    <div id="formMsg" class="msg"></div>
  </div>

  <div class="box">
    <h2>সব ডিজাইন</h2>
    <div id="list">লোড হচ্ছে…</div>
  </div>
</div>

<script>
const SUPABASE_URL='https://lrwoczlnadonjbhaofkj.supabase.co';
const SUPABASE_KEY='sb_publishable_-KQINPEFK49qlLN2HTL-QQ_v0BWN4GV';
const supa=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const catLabel={Saree:'শাড়ি',Salwar:'সেলোয়ার-কামিজ',Kurti:'কুর্তি',Lehenga:'লেহেঙ্গা',Panjabi:'পাঞ্জাবি'};
let items=[];

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function val(id){return document.getElementById(id).value.trim();}
function setMsg(id,text,cls){const el=document.getElementById(id);el.textContent=text;el.className='msg '+(cls||'');}

async function login(){
  const btn=document.getElementById('loginBtn');
  btn.disabled=true;setMsg('loginMsg','');
  const {error}=await supa.auth.signInWithPassword({email:val('email'),password:document.getElementById('password').value});
  btn.disabled=false;
  if(error){setMsg('loginMsg','ইমেইল বা পাসওয়ার্ড ভুল: '+error.message,'err');return;}
  showAdmin();
}
async function logout(){await supa.auth.signOut();location.reload();}
function showAdmin(){
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('adminBox').classList.remove('hidden');
  loadList();
}

function resizeImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=900;
      const s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?resolve(b):reject(new Error('ছবি প্রসেস করা যায়নি')),'image/jpeg',0.85);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('ছবিটি পড়া যাচ্ছে না'));};
    img.src=url;
  });
}
async function uploadImage(file){
  const blob=await resizeImage(file);
  const path=Date.now()+'.jpg';
  const {error}=await supa.storage.from('products').upload(path,blob,{contentType:'image/jpeg'});
  if(error) throw error;
  return supa.storage.from('products').getPublicUrl(path).data.publicUrl;
}

function previewFile(){
  const f=document.getElementById('image').files[0];
  document.getElementById('preview').innerHTML=f?`<img src="${URL.createObjectURL(f)}" alt="প্রিভিউ">`:'';
}

async function loadList(){
  const {data,error}=await supa.from('products').select('*').order('sort_order',{ascending:true}).order('id',{ascending:true});
  if(error){document.getElementById('list').textContent='লোড করা যাচ্ছে না: '+error.message;return;}
  items=data||[];
  document.getElementById('list').innerHTML=items.length?items.map((p,i)=>`
    <div class="item">
      <img src="${esc(p.image_url)}" alt="" onerror="this.style.visibility='hidden'">
      <div class="info"><b>${esc(p.name)}</b><br><small>${esc(catLabel[p.category]||p.category)} · ${p.price>0?'৳'+p.price:'দাম আলোচনা সাপেক্ষে'} · ক্রম ${p.sort_order}</small></div>
      <div class="acts"><button class="sec" onclick="editItem(${i})">এডিট</button><button class="del" onclick="deleteItem(${p.id})">মুছুন</button></div>
    </div>`).join(''):'এখনো কোনো ডিজাইন নেই।';
}

function editItem(i){
  const p=items[i];
  document.getElementById('editId').value=p.id;
  document.getElementById('name').value=p.name||'';
  document.getElementById('category').value=p.category;
  document.getElementById('price').value=p.price||'';
  document.getElementById('description').value=p.description||'';
  document.getElementById('sort').value=p.sort_order||0;
  document.getElementById('image').value='';
  document.getElementById('preview').innerHTML=`<img src="${esc(p.image_url)}" alt="">`;
  document.getElementById('formTitle').textContent='ডিজাইন এডিট করুন';
  window.scrollTo({top:0,behavior:'smooth'});
}

function resetForm(){
  document.getElementById('editId').value='';
  ['name','price','description'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('category').value='Saree';
  document.getElementById('sort').value='0';
  document.getElementById('image').value='';
  document.getElementById('preview').innerHTML='';
  document.getElementById('formTitle').textContent='নতুন ডিজাইন যোগ করুন';
  setMsg('formMsg','');
}

async function saveProduct(){
  const id=val('editId');
  const name=val('name');
  const file=document.getElementById('image').files[0];
  if(!name){setMsg('formMsg','ডিজাইনের নাম লিখুন','err');return;}
  if(!id&&!file){setMsg('formMsg','নতুন ডিজাইনের জন্য ছবি দিন','err');return;}
  const btn=document.getElementById('saveBtn');
  btn.disabled=true;setMsg('formMsg','সেভ হচ্ছে… একটু অপেক্ষা করুন');
  try{
    const row={
      name,
      category:val('category'),
      price:Number(val('price'))||0,
      description:val('description'),
      sort_order:Number(val('sort'))||0
    };
    if(file) row.image_url=await uploadImage(file);
    let res;
    if(id) res=await supa.from('products').update(row).eq('id',id);
    else res=await supa.from('products').insert(row);
    if(res.error) throw res.error;
    setMsg('formMsg','সেভ হয়েছে ✔','ok');
    resetForm();
    setMsg('formMsg','সেভ হয়েছে ✔','ok');
    loadList();
  }catch(e){
    setMsg('formMsg','ভুল হয়েছে: '+e.message,'err');
  }finally{
    btn.disabled=false;
  }
}

async function deleteItem(id){
  if(!confirm('এই ডিজাইনটি মুছে ফেলবেন?')) return;
  const {error}=await supa.from('products').delete().eq('id',id);
  if(error){alert('মুছতে পারিনি: '+error.message);return;}
  loadList();
}

(async()=>{
  const {data}=await supa.auth.getSession();
  if(data&&data.session) showAdmin();
})();
</script>
</body>
</html>
